<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseBoard — Service Health Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: #1e293b; padding: 20px 40px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.8rem; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .status { font-size: 0.9rem; color: #94a3b8; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); }
    .card h3 { font-size: 1rem; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .card .name { font-size: 1.3rem; font-weight: 600; margin-bottom: 8px; }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; }
    .healthy { background: #065f46; color: #6ee7b7; }
    .unhealthy { background: #7f1d1d; color: #fca5a5; }
    .unknown { background: #422006; color: #fcd34d; }
    .metric { color: #94a3b8; font-size: 0.85rem; margin-top: 8px; line-height: 1.6; }
    .metric span { color: #e2e8f0; font-weight: 600; }
    .section { margin-bottom: 30px; }
    .section h2 { font-size: 1.2rem; margin-bottom: 16px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .alert-list { list-style: none; }
    .alert-item { background: #1e293b; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #f59e0b; }
    .alert-item.critical { border-left-color: #ef4444; }
    .alert-item.info { border-left-color: #3b82f6; }
    .alert-item .time { color: #64748b; font-size: 0.8rem; }
    .chart { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 16px; }
    .chart h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .bar { height: 24px; background: #334155; border-radius: 4px; margin: 4px 0; position: relative; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .bar-label { position: absolute; left: 8px; top: 2px; font-size: 0.8rem; color: #e2e8f0; }
    .refresh { color: #64748b; font-size: 0.8rem; text-align: center; margin-top: 20px; }
    .legend { display: flex; gap: 20px; margin-bottom: 20px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #94a3b8; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🟢 PulseBoard</h1>
    <div class="status">Last updated: <span id="lastUpdate">--</span> | Auto-refresh: 5s</div>
  </div>

  <div class="container">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Healthy</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Unhealthy</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Unknown</div>
    </div>

    <div class="section">
      <h2>Service Health</h2>
      <div class="grid" id="services"></div>
    </div>

    <div class="section">
      <h2>Response Time (ms)</h2>
      <div class="chart" id="latencyChart"></div>
    </div>

    <div class="section">
      <h2>Resource Usage</h2>
      <div class="chart" id="resourceChart"></div>
    </div>

    <div class="section">
      <h2>Recent Alerts</h2>
      <ul class="alert-list" id="alerts"></ul>
    </div>

    <div class="refresh">Dashboard auto-refreshes every 5 seconds. Data from PulseBoard API.</div>
  </div>

  <script>
    const API = 'http://localhost:9080';
    const services = [
      { name: 'api-gateway', port: 9080, cpu: 12.5, memory: 45.2, responseTime: 42 },
      { name: 'auth-service', port: 9081, cpu: 8.5, memory: 32.3, responseTime: 25 },
      { name: 'health-checker', port: 9082, cpu: 5.1, memory: 28.9, responseTime: 15 },
      { name: 'metrics-collector', port: 9083, cpu: 3.2, memory: 22.1, responseTime: 18 },
      { name: 'alert-manager', port: 9084, cpu: 2.8, memory: 19.5, responseTime: 12 }
    ];

    async function checkHealth(svc) {
      try {
        const res = await fetch(`http://localhost:${svc.port}/health`);
        const data = await res.json();
        return { status: 'healthy', data };
      } catch (e) {
        return { status: 'unhealthy', data: null };
      }
    }

    async function renderServices() {
      const container = document.getElementById('services');
      const results = await Promise.all(services.map(async (svc) => {
        const health = await checkHealth(svc);
        return { ...svc, health: health.status };
      }));

      container.innerHTML = results.map(svc => `
        <div class="card">
          <h3>${svc.name.replace(/-/g, ' ')}</h3>
          <div class="name">${svc.name}</div>
          <span class="status-badge ${svc.health}">${svc.health.toUpperCase()}</span>
          <div class="metric">
            CPU: <span>${svc.cpu}%</span> | 
            Memory: <span>${svc.memory}%</span> | 
            Response: <span>${svc.responseTime}ms</span>
          </div>
        </div>
      `).join('');
    }

    function renderLatencyChart() {
      const container = document.getElementById('latencyChart');
      const maxTime = Math.max(...services.map(s => s.responseTime));
      container.innerHTML = services.map(svc => `
        <div class="bar">
          <div class="bar-fill" style="width:${(svc.responseTime/maxTime*100)}%;background:#38bdf8"></div>
          <div class="bar-label">${svc.name}: ${svc.responseTime}ms</div>
        </div>
      `).join('');
    }

    function renderResourceChart() {
      const container = document.getElementById('resourceChart');
      container.innerHTML = services.map(svc => `
        <div style="margin-bottom:12px">
          <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px">${svc.name}</div>
          <div class="bar">
            <div class="bar-fill" style="width:${svc.cpu}%;background:#22c55e"></div>
            <div class="bar-label">CPU: ${svc.cpu}%</div>
          </div>
          <div class="bar">
            <div class="bar-fill" style="width:${svc.memory}%;background:#818cf8"></div>
            <div class="bar-label">Memory: ${svc.memory}%</div>
          </div>
        </div>
      `).join('');
    }

    async function renderAlerts() {
      const container = document.getElementById('alerts');
      try {
        const res = await fetch('http://localhost:9084/history');
        const data = await res.json();
        container.innerHTML = data.map(alert => `
          <li class="alert-item ${alert.severity}">
            <strong>${alert.service}</strong> — ${alert.message}
            <div class="time">${new Date(alert.timestamp).toLocaleString()}</div>
          </li>
        `).join('') || '<li class="alert-item info">No alerts yet</li>';
      } catch (e) {
        container.innerHTML = '<li class="alert-item info">Alert service not available</li>';
      }
    }

    async function refresh() {
      await renderServices();
      renderLatencyChart();
      renderResourceChart();
      await renderAlerts();
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
