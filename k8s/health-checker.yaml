# Health Checker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-checker
  namespace: pulseboard
  labels:
    app: health-checker
    app.kubernetes.io/name: health-checker
    app.kubernetes.io/part-of: pulseboard
    app.kubernetes.io/component: monitoring
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: health-checker
  template:
    metadata:
      labels:
        app: health-checker
        app.kubernetes.io/name: health-checker
        app.kubernetes.io/part-of: pulseboard
    spec:
      serviceAccountName: pulseboard-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: health-checker
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/pulseboard/health-checker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: pulseboard-config
                  key: NODE_ENV
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: pulseboard-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: health-checker
  namespace: pulseboard
  labels:
    app: health-checker
    app.kubernetes.io/part-of: pulseboard
spec:
  type: ClusterIP
  selector:
    app: health-checker
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
